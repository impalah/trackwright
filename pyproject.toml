[project]
name = "trackwright"
version = "0.4.0"
description = "Independent MCP server for controlling digital audio workstations (DAWs). First implementation: Cubase, through a MIDI Remote script"
readme = "README.md"
authors = [
    { name = "impalah", email = "impalah@gmail.com" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["mcp", "daw", "cubase", "midi-remote", "audio", "podcast", "claude", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Typing :: Typed",
]
dependencies = [
    "loguru>=0.8.0,<1",
    "mcp>=2.3.0,<3",  # TW-1415: a major version may change the tool API
    "pydantic>=2.14.3,<3",
    # TW-1302: on macOS the bridge uses CoreMIDI through ctypes (nothing to compile). The mido + python-rtmidi
    # transport (trackwright.transport.MidiTransport) is kept for other platforms or as a fallback: uncomment
    # these two lines and set [bridge] backend = "rtmidi". python-rtmidi is built from source on macOS
    # (it needs the Xcode command line tools).
    # "mido>=1.3.3",
    # "python-rtmidi>=1.5.8",
]

[project.urls]
Repository = "https://github.com/impalah/trackwright"
Issues = "https://github.com/impalah/trackwright/issues"
Author = "https://pressanykey.tech"

[project.scripts]
trackwright = "trackwright.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trackwright"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "PL", "RUF", "S", "T20", "LOG",
          "PT", "PERF", "FURB", "ASYNC", "TRY"]  # TW-1415: PT, PERF, FURB, ASYNC, TRY added
ignore = [
    "PLR0913",  # explicit keyword arguments on service methods are clearer than parameter objects
    "PLR2004",  # protocol constants are named where they matter
    "S101",     # assert is used in tests
    "TRY003",   # exception messages are part of the API (they reach the MCP client): kept inline
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415", "SLF001"]
"experiments/**" = ["S", "PLR", "T20"]  # throwaway probes: linted, not type-checked (TW-1415)
"src/trackwright/server.py" = ["PLR0917"]  # an MCP tool's parameters are its input schema

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/trackwright", "tests"]  # T-10: the tests are type-checked too
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mido", "mido.*", "rtmidi", "rtmidi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
filterwarnings = ["error"]  # TW-1415: a new warning fails the suite instead of scrolling past
timeout = 120  # pytest-timeout: a hung test (Node harness, sockets) fails instead of blocking CI
markers = [
    "integration: needs a running bridge and Cubase (opt-in: TRACKWRIGHT_INTEGRATION=1)",
    "integration_write: modifies the open Cubase project (opt-in: TRACKWRIGHT_ALLOW_WRITES=1)",
    "node: runs the MIDI Remote script under Node.js (skipped if node is missing)",
    "slow: builds the distribution (a few seconds)",
]

[tool.coverage.run]
source = ["trackwright"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.4",
]

# Mutation testing (TW-1410): `make mutation` runs mutmut through `uv run --with` (no project dependency).
[tool.mutmut]
source_paths = [
    "src/trackwright/protocol.py",
    "src/trackwright/core/policy.py",
    "src/trackwright/core/refs.py",
    "src/trackwright/ops.py",
    "src/trackwright/host.py",
    "src/trackwright/hostport.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_protocol.py",
    "tests/unit/test_protocol_properties.py",
    "tests/unit/test_core_basics.py",
    "tests/unit/test_write_policy_tw1401.py",
    "tests/unit/test_host.py",
    "tests/unit/test_service_writing.py",
    "tests/unit/test_service_commands.py",
    "tests/unit/test_service_ranges.py",
    "tests/unit/test_service_saving.py",
    "tests/unit/test_mutation_edges.py",
    "tests/unit/test_mutation_host.py",
    "tests/unit/test_session_pinning_tw1402.py",
    "tests/unit/test_core_basics.py",
]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q", "-x"]
also_copy = ["src", "tests", "docs", "README.md", "README.es.md", "CHANGELOG.md", "CHANGELOG.es.md", "CLAUDE.md", "LICENSE"]
