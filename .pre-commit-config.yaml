# TW-1415: the same gates as `make check`, minus the tests, before every commit.
# Hooks run through `uv run`, so ruff and mypy are the versions in uv.lock.
# Enable once with: uvx pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict, whole project)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
