# Continuous integration (TW-1404): the same gates as `make check`, plus the Cubase script under Node
# and the package build. macOS, because the default MIDI transport is CoreMIDI.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node.js (Cubase script tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Environment
        run: uv sync --locked

      - name: Lint, format, types and tests with coverage
        run: make check

      - name: Cubase script tests (Node)
        run: make test-node

      - name: Build and validate the distribution
        run: |
          make build
          make dist-check
